<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decoraciones Navidad PTY 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f4f4;color:#222}header{background:#32174d;color:#fff;padding:14px 4%;display:flex;align-items:center;gap:14px;min-height:72px}header img{max-height:58px;max-width:180px;object-fit:contain}header h1{font-size:21px;margin:0}header p{margin:3px 0 0;opacity:.86;font-size:13px}
#map{height:calc(100vh - 72px);min-height:500px}.hide{display:none!important}
.topbar{position:absolute;z-index:1000;top:88px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 10px;border-radius:12px;box-shadow:0 3px 14px #0004;display:flex;gap:8px;align-items:center}
button{border:0;border-radius:9px;padding:9px 12px;background:#32174d;color:#fff;font-weight:700;cursor:pointer}
.sector-pin{width:37px;height:52px;position:relative;filter:drop-shadow(0 4px 6px #0007);transition:transform .18s ease,filter .18s ease;transform-origin:50% 88%}
.sector-pin:hover,.sector-pin.forced-hover{transform:scale(2.75) translateY(-5px);filter:drop-shadow(0 11px 15px #0009) brightness(1.12) saturate(1.08);z-index:9999}
.sector-pin .pin-shell{position:absolute;left:0;top:0;width:37px;height:47px;background:linear-gradient(145deg,#ef4962 0%,#c51f3a 48%,#7f1026 100%);clip-path:path("M18.5 0 C8.3 0 0 8.3 0 18.5 C0 31.5 18.5 47 18.5 47 C18.5 47 37 31.5 37 18.5 C37 8.3 28.7 0 18.5 0 Z")}
.sector-pin .pin-photo{position:absolute;left:2px;top:2px;width:33px;height:33px;border-radius:50%;overflow:hidden;background:#eee;z-index:2;border:1px solid rgba(255,255,255,.98)}
.sector-pin .pin-photo img{width:100%;height:100%;object-fit:cover;display:block}
.sector-pin .pin-photo .fallback{width:100%;height:100%;display:grid;place-items:center;font-size:17px;background:#eee}
.sector-label{position:absolute;left:50%;top:48px;transform:translateX(-50%);white-space:nowrap;background:transparent;color:#fff;padding:3px 5px;font-family:'Montserrat',system-ui,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.35px;line-height:1.15;text-shadow:none;-webkit-text-stroke:.45px #32174d;paint-order:stroke fill}
.sector-pin:hover .sector-label,.sector-pin.forced-hover .sector-label{transform:translateX(-50%) scale(.673);transform-origin:top center}

.sector-nav{position:absolute;z-index:900;right:18px;top:92px;width:min(265px,30vw);max-height:calc(100vh - 125px);overflow:auto;padding:8px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.65);border-radius:15px;box-shadow:0 5px 18px #0003}
.sector-nav-title{font-family:'Montserrat',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#32174d;padding:5px 7px 8px}
.sector-nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px;border:0;border-radius:11px;background:transparent;color:#222;text-align:left;cursor:pointer;transition:background .16s ease,transform .16s ease}
.sector-nav-item:hover,.sector-nav-item.active{background:rgba(255,255,255,.92);transform:translateX(-3px)}
.sector-nav-photo{width:44px;height:44px;flex:0 0 44px;border-radius:50%;object-fit:cover;background:#eee;border:2px solid #c51f3a;box-shadow:0 2px 6px #0003}
.sector-nav-name{font-family:'Montserrat',system-ui,sans-serif;font-size:12px;font-weight:600;line-height:1.15;color:#32174d}
.element-pin{width:52px;height:52px;border-radius:50%;position:relative;filter:drop-shadow(0 2px 5px #0008);transition:transform .18s ease}.element-pin:hover{transform:scale(1.2)}
.element-clip{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#32174d;display:flex;align-items:center;justify-content:center;font-size:26px}.element-clip img{width:100%;height:100%;object-fit:cover}
.leaflet-marker-icon:hover{z-index:1000!important}
.modal{border:0;border-radius:16px;padding:0;width:min(520px,94%);max-height:88vh;overflow:auto;box-shadow:0 15px 45px #0007}.modal::backdrop{background:#0008}.hero{width:100%;height:260px;object-fit:contain;background:#000;display:block}.pad{padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.stars button{font-size:25px;background:transparent;color:#bbb;padding:2px}.stars button.on{color:#f4b400}textarea,select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:5px 0 10px}.muted{font-size:13px;color:#68736d}.comments{border-top:1px solid #ddd;margin-top:12px;padding-top:10px}.comment{background:#f6f6f6;border-radius:9px;padding:9px;margin:6px 0}
@media(max-width:600px){header h1{font-size:17px}.sector-pin{transform:scale(.92)}.sector-pin:hover{transform:scale(2.0) translateY(-4px)}.sector-pin:hover .sector-label{transform:translateX(-50%) scale(.74)}}.sector-pin:hover{transform:scale(2.0) translateY(-4px)}.sector-pin:hover .sector-label{transform:translateX(-50%) scale(.74)}}

@media(max-width:700px){
 .sector-nav{top:auto;right:8px;left:8px;bottom:12px;width:auto;max-height:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:7px;border-radius:14px}
 .sector-nav-title{display:none}
 .sector-nav-item{min-width:max-content;padding:5px 7px;transform:none!important}
 .sector-nav-photo{width:36px;height:36px;flex-basis:36px}
 .sector-nav-name{font-size:11px;max-width:115px;white-space:normal}
}

.access-modal{border:0;border-radius:16px;padding:0;width:min(430px,92%);box-shadow:0 15px 45px #0007}
.access-modal::backdrop{background:#0008}.access-pad{padding:22px}.access-pad h2{margin:0 0 8px;color:#32174d}
.access-code{font-family:'Montserrat',system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.access-error{min-height:20px;margin:0 0 10px;color:#b42323;font-size:13px;font-weight:650}
.access-actions{display:flex;gap:8px;flex-wrap:wrap}.access-actions .gray{background:#68736d}

</style></head><body>
<header><img id="logo" class="hide"><div><h1 id="title">Decoraciones Navidad PTY 2026</h1><p id="subtitle">Explorá nuestros espacios y compartí tu experiencia.</p></div></header>
<div id="sectorNav" class="sector-nav hide"></div><div id="sectorBar" class="topbar hide"><button onclick="showGeneral()">← Sectores</button><b id="sectorTitle"></b></div><div id="map"></div>
<dialog id="accessDlg" class="access-modal"><div class="access-pad">
<h2 id="accessTitle">Acceso al sector</h2><p class="muted">Este sector requiere un código de acceso.</p>
<label for="accessCode"><b>Código de acceso</b></label>
<input id="accessCode" class="access-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PTY-XXXX-XXXX">
<p id="accessError" class="access-error"></p><div class="access-actions">
<button id="accessSubmit" onclick="validateSectorAccess()">Ingresar al sector</button>
<button class="gray" onclick="cancelSectorAccess()">Cancelar</button></div></div></dialog>
<dialog id="elementDlg" class="modal"><div id="elementHero"></div><div class="pad"><h2 id="elementTitle"></h2><p id="elementDesc"></p><div id="ratingSummary" class="muted"></div>
<h3>Tu valoración</h3><div id="stars" class="stars"></div><textarea id="commentText" rows="3" placeholder="Comentario opcional"></textarea><button onclick="saveRating()">Enviar valoración</button>
<div id="comments" class="comments"></div><hr><h3>⚠️ Reportar problema</h3><select id="reportType"><option value="no_funciona">No funciona</option><option value="dano_fisico">Daño físico</option><option value="vandalismo">Vandalismo</option><option value="suciedad">Suciedad / mantenimiento</option><option value="otro">Otro</option></select><textarea id="reportDesc" rows="3" placeholder="Describí el problema"></textarea><label>Fotografía opcional</label><input id="reportPhoto" type="file" accept="image/*" capture="environment"><div class="row"><button onclick="sendReport()">Enviar reporte</button><button onclick="elementDlg.close()">Cerrar</button></div></div></dialog>
<script>
const sb=supabase.createClient("https://hntfbtviyxhigxjhbwhy.supabase.co","sb_publishable_FADYkI8IP23NMUYEY96pLA_IfHWVTZ6",{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
let map,sectors=[],sectorLayers=[],elementMarkers=[],sectorMarkerById={},sectorAreaById={},currentSector=null,currentElement=null,currentElements=[],rating=0,pendingSector=null,validatingAccess=false;
const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initMap(){map=L.map('map',{maxZoom:21}).setView([8.9824,-79.5199],12);let sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Imagery © Esri'}).addTo(map);let streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,attribution:'© OpenStreetMap'});L.control.layers({'🛰️ Satélite':sat,'🗺️ Calles':streets}).addTo(map)}
async function boot(){initMap();let {data:c}=await sb.from('configuracion').select('*').eq('id',1).single();if(c){$('title').textContent=c.titulo||'Decoraciones Navidad PTY 2026';$('subtitle').textContent=c.subtitulo||'';if(c.logo_url){$('logo').src=c.logo_url;$('logo').classList.remove('hide')}}let {data,error}=await sb.from('sectores').select('id,nombre,descripcion,imagen_url,area_geojson,centro_lat,centro_lng,activo,orden').eq('activo',true).order('orden').order('nombre');if(error)return alert(error.message);sectors=data||[];showGeneral()}
function clearMap(){sectorLayers.forEach(x=>x.remove());sectorLayers=[];elementMarkers.forEach(x=>x.remove());elementMarkers=[];sectorMarkerById={};sectorAreaById={}}
function sectorIcon(s){let photo=s.imagen_url?`<img src="${esc(s.imagen_url)}">`:`<div class="fallback">📍</div>`;return L.divIcon({className:'',html:`<div class="sector-pin" data-sector="${s.id}"><div class="pin-shell"></div><div class="pin-photo">${photo}</div><div class="sector-label">${esc(s.nombre)}</div></div>`,iconSize:[37,70],iconAnchor:[19,47]})}
function navPhoto(s){return s.imagen_url?`<img class="sector-nav-photo" src="${esc(s.imagen_url)}" alt="">`:`<div class="sector-nav-photo" style="display:grid;place-items:center">📍</div>`}
function renderSectorNav(){
 let nav=$('sectorNav');
 nav.innerHTML=`<div class="sector-nav-title">Sectores</div>`+sectors.map(s=>`<button class="sector-nav-item" data-nav-sector="${s.id}" onclick="openSector('${s.id}')" onmouseenter="highlightSector('${s.id}',true)" onmouseleave="highlightSector('${s.id}',false)">${navPhoto(s)}<span class="sector-nav-name">${esc(s.nombre)}</span></button>`).join('');
 nav.classList.toggle('hide',!sectors.length);
}
function highlightSector(id,on){
 let pin=document.querySelector(`.sector-pin[data-sector="${id}"]`);
 let item=document.querySelector(`.sector-nav-item[data-nav-sector="${id}"]`);
 if(pin)pin.classList.toggle('forced-hover',on);
 if(item)item.classList.toggle('active',on);
 let area=sectorAreaById[id];
 if(area)area.setStyle({weight:on?4:2,fillOpacity:on?.18:.06,color:on?'#c51f3a':'#8b218e'});
}
function showGeneral(){
 currentSector=null;$('sectorBar').classList.add('hide');clearMap();renderSectorNav();$('sectorNav').classList.remove('hide');
 let bounds=[];
 sectors.forEach(s=>{
   let area=L.geoJSON(s.area_geojson,{style:{color:'#8b218e',weight:2,fillOpacity:.06}}).addTo(map);
   sectorLayers.push(area);sectorAreaById[s.id]=area;
   let m=L.marker([s.centro_lat,s.centro_lng],{icon:sectorIcon(s)}).addTo(map)
     .on('click',()=>openSector(s.id))
     .on('mouseover',()=>highlightSector(s.id,true))
     .on('mouseout',()=>highlightSector(s.id,false));
   sectorLayers.push(m);sectorMarkerById[s.id]=m;bounds.push(area.getBounds());
 });
 if(bounds.length){let all=bounds[0];for(let i=1;i<bounds.length;i++)all.extend(bounds[i]);map.fitBounds(all,{padding:[55,55],maxZoom:15})}
}
function openSector(id){
 let s=sectors.find(x=>x.id===id);if(!s)return;
 pendingSector=s;$('accessTitle').textContent='Acceso a '+s.nombre;$('accessCode').value='';$('accessError').textContent='';
 $('accessSubmit').disabled=false;$('accessSubmit').textContent='Ingresar al sector';$('accessDlg').showModal();
 setTimeout(()=>$('accessCode').focus(),80);
}
function cancelSectorAccess(){pendingSector=null;$('accessCode').value='';$('accessError').textContent='';$('accessDlg').close()}
async function validateSectorAccess(){
 if(validatingAccess||!pendingSector)return;
 let code=$('accessCode').value.trim().toUpperCase();
 if(!code){$('accessError').textContent='Ingresá el código de acceso.';$('accessCode').focus();return}
 validatingAccess=true;$('accessSubmit').disabled=true;$('accessSubmit').textContent='Verificando...';$('accessError').textContent='';
 let {data,error}=await sb.rpc('validar_acceso_sector',{p_sector_id:pendingSector.id,p_codigo:code});
 validatingAccess=false;$('accessSubmit').disabled=false;$('accessSubmit').textContent='Ingresar al sector';
 if(error){console.error(error);$('accessError').textContent='No fue posible validar el acceso. Intentá nuevamente.';return}
 if(data!==true){$('accessError').textContent='Código incorrecto. Verificá el código e intentá nuevamente.';$('accessCode').select();return}
 let s=pendingSector;pendingSector=null;$('accessDlg').close();await enterSector(s);
}
async function enterSector(s){
 currentSector=s;clearMap();$('sectorNav').classList.add('hide');$('sectorTitle').textContent=s.nombre;$('sectorBar').classList.remove('hide');
 let area=L.geoJSON(s.area_geojson);map.fitBounds(area.getBounds(),{padding:[30,30]});
 let {data,error}=await sb.from('elementos').select('*').eq('sector_id',s.id).eq('activo',true).order('orden').order('nombre');if(error)return alert(error.message);
 currentElements=data||[];
 currentElements.forEach(e=>{let inside=e.foto_url?`<img src="${esc(e.foto_url)}">`:'✨';let icon=L.divIcon({className:'',html:`<div class="element-pin"><div class="element-clip">${inside}</div></div>`,iconSize:[52,52],iconAnchor:[26,26]});elementMarkers.push(L.marker([e.lat,e.lng],{icon}).addTo(map).on('click',()=>openElement(e.id)))})
}
async function openElement(id){currentElement=currentElements.find(x=>x.id===id);if(!currentElement)return;rating=0;$('elementHero').innerHTML=currentElement.foto_url?`<img class="hero" src="${esc(currentElement.foto_url)}">`:'';$('elementTitle').textContent=currentElement.nombre;$('elementDesc').textContent=currentElement.descripcion||'';$('commentText').value='';$('reportDesc').value='';$('reportPhoto').value='';renderStars();await loadElementSocial();$('elementDlg').showModal()}
function renderStars(){ $('stars').innerHTML=[1,2,3,4,5].map(n=>`<button class="${n<=rating?'on':''}" onclick="rating=${n};renderStars()">★</button>`).join('')}
async function loadElementSocial(){let id=currentElement.id;let [{data:v},{data:c}]=await Promise.all([sb.from('valoraciones').select('estrellas').eq('elemento_id',id),sb.from('comentarios').select('*').eq('elemento_id',id).eq('aprobado',true).order('creado_en',{ascending:false})]);let avg=v?.length?(v.reduce((a,x)=>a+x.estrellas,0)/v.length).toFixed(1):'—';$('ratingSummary').textContent=v?.length?`⭐ ${avg} (${v.length} valoraciones)`:'Sin valoraciones todavía';$('comments').innerHTML=c?.length?'<h3>Comentarios</h3>'+c.map(x=>`<div class="comment">${esc(x.comentario)}</div>`).join(''):''}
async function saveRating(){let c=$('commentText').value.trim();if(!rating&&!c)return alert('Elegí estrellas o escribí un comentario.');if(rating){let {error}=await sb.from('valoraciones').insert({elemento_id:currentElement.id,estrellas:rating});if(error)return alert('No se pudo guardar la valoración: '+error.message)}if(c){let {error}=await sb.from('comentarios').insert({elemento_id:currentElement.id,comentario:c,aprobado:false});if(error)return alert('La valoración se guardó, pero el comentario no: '+error.message)}alert('¡Gracias!');$('commentText').value='';rating=0;renderStars();loadElementSocial()}
async function sendReport(){let desc=$('reportDesc').value.trim(),file=$('reportPhoto').files[0],path=null;if(!desc&&!file)return alert('Describí el problema o adjuntá una fotografía.');if(file){let ext=(file.name.split('.').pop()||'jpg').toLowerCase();path=`${currentElement.id}/${crypto.randomUUID()}.${ext}`;let {error}=await sb.storage.from('reportes').upload(path,file,{contentType:file.type||undefined});if(error)return alert('No se pudo subir la foto: '+error.message)}let {error}=await sb.from('reportes').insert({elemento_id:currentElement.id,tipo:$('reportType').value,descripcion:desc||null,foto_url:path,estado:'pendiente'});if(error)return alert('No se pudo enviar el reporte: '+error.message);alert('Reporte enviado. Gracias por ayudarnos a cuidar las decoraciones.');$('reportDesc').value='';$('reportPhoto').value=''}
$('accessCode').addEventListener('input',()=>{$('accessCode').value=$('accessCode').value.toUpperCase();$('accessError').textContent=''});
$('accessCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();validateSectorAccess()}});
boot();
</script></body></html>
